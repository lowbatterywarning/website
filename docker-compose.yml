services:
  zamfara-web:
    image: ghcr.io/lowbatterywarning/website:latest
    container_name: zamfara-web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTPS_PORT: "443"
      ZAMFARA_FORWARDEDHEADERS_ENABLED: "true"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - zamfara-data:/app/App_Data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - web

networks:
  web:

volumes:
  zamfara-data:
